<!DOCTYPE html>
<html>
<head>
    <title>AI Suggestion Debug Console</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body>
    <h1>AI Suggestion Debug Console</h1>
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    
    <script>
        const socket = io('http://localhost:5000');
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        
        function addMessage(msg) {
            const div = document.createElement('div');
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${msg}`;
            messagesDiv.appendChild(div);
            console.log(msg);
        }
        
        socket.on('connect', () => {
            statusDiv.innerHTML = '✅ Connected to server';
            addMessage('🔌 Connected to WebSocket server');
        });
        
        socket.on('disconnect', () => {
            statusDiv.innerHTML = '❌ Disconnected from server';
            addMessage('🔌 Disconnected from WebSocket server');
        });
        
        socket.on('field_suggestion_added', (data) => {
            addMessage('🤖 field_suggestion_added received:');
            addMessage(JSON.stringify(data, null, 2));
            
            if (data.suggestion?.author === 'AI Assistant') {
                addMessage(`🤖 AI Suggestion Details:`);
                addMessage(`   - ID: ${data.suggestion.suggestion_id}`);
                addMessage(`   - Field: ${data.suggestion.field}`);
                addMessage(`   - Value: "${data.suggestion.suggested_value}"`);
                addMessage(`   - Value Length: ${data.suggestion.suggested_value?.length || 0}`);
                addMessage(`   - Status: ${data.suggestion.status}`);
                addMessage(`   - Author: ${data.suggestion.author}`);
            }
        });
        
        socket.on('llm_suggestion_generated', (data) => {
            addMessage('🤖 llm_suggestion_generated received:');
            addMessage(JSON.stringify(data, null, 2));
        });
        
        // Listen for all events
        socket.onAny((event, ...args) => {
            if (event !== 'connect' && event !== 'disconnect') {
                addMessage(`📡 WebSocket Event: ${event}`);
                addMessage(`📊 Data: ${JSON.stringify(args, null, 2)}`);
            }
        });
        
        // Test connection
        addMessage('🚀 Debug console loaded');
    </script>
</body>
</html>
