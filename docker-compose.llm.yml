# Docker Compose for Interview Platform with Local LLM Support
version: '3.8'

services:
  # MongoDB Database
  db:
    image: mongo:6.0
    container_name: interview_db_llm
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: interview-assistant
    volumes:
      - mongodb_data_llm:/data/db
    ports:
      - "27017:27017"
    networks:
      - interview_network_llm
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend with Local LLM Support
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.llm
      args:
        DOWNLOAD_MODEL_AT_BUILD: ${DOWNLOAD_MODEL_AT_BUILD:-false}
        HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
    container_name: interview_backend_llm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Flask Configuration
      FLASK_APP: app
      FLASK_ENV: ${FLASK_ENV:-production}
      SERVER_PORT: 5000
      SECRET_KEY: ${SECRET_KEY:-interview-assistant-secret-key-change-in-production}
      
      # Database
      MONGO_URI: mongodb://db:27017/interview-assistant
      
      # LLM Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      
      # Local LLM Settings
      USE_LOCAL_MODEL: ${USE_LOCAL_MODEL:-true}
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME:-meta-llama/Llama-3.2-1B-Instruct}
      LOCAL_MODEL_PATH: ./models/llama-1b-instruct
      PREWARM_LOCAL_MODEL: ${PREWARM_LOCAL_MODEL:-false}
      
      # Rate Limiting
      LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-15}
      LLM_REQUESTS_PER_DAY: ${LLM_REQUESTS_PER_DAY:-1500}
      
      # Application Limits
      MAX_SESSION_PARTICIPANTS: ${MAX_SESSION_PARTICIPANTS:-10}
      MAX_QUESTIONS_PER_TEMPLATE: ${MAX_QUESTIONS_PER_TEMPLATE:-20}
      SESSION_TIMEOUT_HOURS: ${SESSION_TIMEOUT_HOURS:-24}
    
    volumes:
      # Persistent model storage
      - llm_models:/app/models
      - llm_cache:/app/.cache
      # Optional: bind mount for development
      # - ./server:/app
    
    ports:
      - "5000:5000"
    
    networks:
      - interview_network_llm
    
    # Resource limits for LLM workload
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 60s

  # Frontend (React)
  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: interview_frontend_llm
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_WS_URL: ws://localhost:5000
    ports:
      - "3000:3000"
    networks:
      - interview_network_llm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: interview_nginx_llm
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./ssl:/etc/nginx/ssl:ro  # For SSL certificates
    networks:
      - interview_network_llm
    profiles:
      - with-proxy

volumes:
  mongodb_data_llm:
    driver: local
  llm_models:
    driver: local
  llm_cache:
    driver: local

networks:
  interview_network_llm:
    driver: bridge