services:
  server:
    build: ./server
    ports:
      - "5001:5001"
    volumes:
      - ./server:/app
    environment:
      - FLASK_APP=${FLASK_APP}
      - FLASK_ENV=testing
      - MONGO_URI=mongodb://db:27017/interview-assistant-test
      - SERVER_PORT=${SERVER_PORT:-5001}
      - SECRET_KEY=${SECRET_KEY}
      - LLM_MODEL=${LLM_MODEL}
      
      # LLM Configuration
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_REQUESTS_PER_MINUTE=${LLM_REQUESTS_PER_MINUTE}
      - LLM_REQUESTS_PER_DAY=${LLM_REQUESTS_PER_DAY}
      
      - MAX_SESSION_PARTICIPANTS=${MAX_SESSION_PARTICIPANTS}
      - MAX_QUESTIONS_PER_TEMPLATE=${MAX_QUESTIONS_PER_TEMPLATE}
      - SESSION_TIMEOUT_HOURS=${SESSION_TIMEOUT_HOURS}
      - TESTING=true
      - TEST_MODE=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  tests:
    build:
      context: ./server
      dockerfile: Dockerfile.test
    volumes:
      - ./server:/app
    environment:
      - FLASK_ENV=testing
      - MONGO_URI=mongodb://db:27017/interview-assistant-test
      - SERVER_PORT=${SERVER_PORT:-5001}
      - SECRET_KEY=${SECRET_KEY:-interview-assistant-secret-key}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TESTING=true
      - TEST_MODE=1
      - TEST_SERVER_HOST=server
      - TEST_SERVER_PORT=5001
    depends_on:
      server:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - test-network

  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - test_mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=interview-assistant-test
    networks:
      - test-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  test-network:
    driver: bridge

volumes:
  test_mongodb_data: