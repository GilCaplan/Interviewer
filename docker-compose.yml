services:
  server:
    build: ./server
    ports:
      - "5001:5001"  # Changed from "5000:5000"
    volumes:
      - ./server:/app
    environment:
      - FLASK_APP=app/__init__.py
      - FLASK_ENV=development
      - MONGO_URI=${MONGO_URI}
    depends_on:
      - db
    networks:
      - app-network
    restart: unless-stopped  # Added restart policy

  client:
    build: ./Client
    ports:
      - "3000:3000"
    volumes:
      - ./Client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - app-network
    restart: unless-stopped  # Added restart policy
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true  # Better hot-reloading in Docker
      - WDS_SOCKET_PORT=0  # Needed for create-react-app in Docker

  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    restart: unless-stopped  # Added restart policy

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data: