services:
  server:
    build: ./server
    ports:
      - "5001:5001"
    volumes:
      - ./server:/app
    environment:
      - FLASK_APP=${FLASK_APP}
      - FLASK_ENV=${FLASK_ENV}
      - MONGO_URI=${MONGO_URI}
      - SERVER_PORT=${SERVER_PORT}
      - SECRET_KEY=${SECRET_KEY}
      - LLM_MODEL=${LLM_MODEL}
      
      # LLM Configuration
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_REQUESTS_PER_MINUTE=${LLM_REQUESTS_PER_MINUTE}
      - LLM_REQUESTS_PER_DAY=${LLM_REQUESTS_PER_DAY}
      
      - MAX_SESSION_PARTICIPANTS=${MAX_SESSION_PARTICIPANTS}
      - MAX_QUESTIONS_PER_TEMPLATE=${MAX_QUESTIONS_PER_TEMPLATE}
      - SESSION_TIMEOUT_HOURS=${SESSION_TIMEOUT_HOURS}
      - TESTING=true
      - TEST_MODE=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  client:
    build: ./Client
    ports:
      - "3000:3000"
    volumes:
      - ./Client:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_WS_URL=${REACT_APP_WS_URL}  # NEW
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=interview-assistant
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data: