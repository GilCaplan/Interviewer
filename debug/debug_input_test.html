<!DOCTYPE html>
<html>
<head>
    <title>Debug Input Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        textarea, input { width: 300px; margin: 5px; padding: 8px; }
        .disabled { background-color: #f0f0f0; }
        .success { color: green; }
        .error { color: red; }
        button { margin: 5px; padding: 8px 15px; }
    </style>
</head>
<body>
    <h1>Template Editor Input Debug Test</h1>
    
    <div class="test-section">
        <h3>Basic Input Test</h3>
        <p>This tests if basic HTML inputs work in your browser:</p>
        <textarea placeholder="Type here - this should work"></textarea><br>
        <input type="text" placeholder="Type here - this should work too">
    </div>
    
    <div class="test-section">
        <h3>Disabled Input Test</h3>
        <p>This shows how disabled inputs behave:</p>
        <textarea disabled placeholder="This is disabled - can't type"></textarea><br>
        <input type="text" disabled placeholder="This is also disabled">
    </div>
    
    <div class="test-section">
        <h3>React-like State Test</h3>
        <p>This simulates how React controlled inputs work:</p>
        <textarea id="controlledTextarea" placeholder="Controlled textarea"></textarea><br>
        <input type="text" id="controlledInput" placeholder="Controlled input"><br>
        <button onclick="toggleDisabled()">Toggle Disabled</button>
        <button onclick="clearValues()">Clear Values</button>
        <div id="stateInfo"></div>
    </div>
    
    <div class="test-section">
        <h3>API Test</h3>
        <p>Test the actual API endpoint:</p>
        <input type="text" id="sessionId" placeholder="Session ID" /><br>
        <input type="text" id="questionId" placeholder="Question ID" /><br>
        <input type="text" id="fieldName" placeholder="Field name (e.g., question_text)" value="question_text" /><br>
        <textarea id="fieldValue" placeholder="Field value"></textarea><br>
        <button onclick="testApiUpdate()">Test API Update</button>
        <div id="apiResult"></div>
    </div>

    <script>
        let isDisabled = false;
        let currentValue = '';
        
        const controlledTextarea = document.getElementById('controlledTextarea');
        const controlledInput = document.getElementById('controlledInput');
        const stateInfo = document.getElementById('stateInfo');
        
        // Simulate React controlled component behavior
        function updateStateInfo() {
            stateInfo.innerHTML = `
                <div>Current value: "${currentValue}"</div>
                <div>Is disabled: ${isDisabled}</div>
                <div>Textarea disabled: ${controlledTextarea.disabled}</div>
                <div>Input disabled: ${controlledInput.disabled}</div>
            `;
        }
        
        function toggleDisabled() {
            isDisabled = !isDisabled;
            controlledTextarea.disabled = isDisabled;
            controlledInput.disabled = isDisabled;
            updateStateInfo();
        }
        
        function clearValues() {
            currentValue = '';
            controlledTextarea.value = '';
            controlledInput.value = '';
            updateStateInfo();
        }
        
        // Add event listeners
        controlledTextarea.addEventListener('input', (e) => {
            currentValue = e.target.value;
            controlledInput.value = currentValue; // Sync values
            updateStateInfo();
        });
        
        controlledInput.addEventListener('input', (e) => {
            currentValue = e.target.value;
            controlledTextarea.value = currentValue; // Sync values
            updateStateInfo();
        });
        
        async function testApiUpdate() {
            const resultDiv = document.getElementById('apiResult');
            const sessionId = document.getElementById('sessionId').value;
            const questionId = document.getElementById('questionId').value;
            const fieldName = document.getElementById('fieldName').value;
            const fieldValue = document.getElementById('fieldValue').value;
            
            if (!sessionId || !questionId || !fieldName) {
                resultDiv.innerHTML = '<div class="error">Please fill in session ID, question ID, and field name</div>';
                return;
            }
            
            resultDiv.innerHTML = 'Testing API update...';
            
            try {
                // Get token from localStorage
                const token = localStorage.getItem('token');
                if (!token) {
                    resultDiv.innerHTML = '<div class="error">No authentication token found. Please login first.</div>';
                    return;
                }
                
                const response = await fetch(`http://localhost:5000/api/sessions/${sessionId}/questions/${questionId}/update`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        field: fieldName,
                        value: fieldValue
                    })
                });
                
                const responseText = await response.text();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="success">✓ API Update successful</div><pre>${responseText}</pre>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">✗ API Update failed (${response.status})</div><pre>${responseText}</pre>`;
                }
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">✗ Network error: ${error.message}</div>`;
            }
        }
        
        // Initialize
        updateStateInfo();
        
        // Auto-populate fields if token exists
        window.onload = function() {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('apiResult').innerHTML = 
                    `<div class="success">Found authentication token: ${token.substring(0, 30)}...</div>`;
            }
        };
    </script>
</body>
</html>
