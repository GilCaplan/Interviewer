<!DOCTYPE html>
<html>
<head>
    <title>Template Editor Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { margin: 5px; padding: 8px 15px; }
    </style>
</head>
<body>
    <h1>Template Editor Debug Test</h1>
    
    <div class="test-section">
        <h3>Authentication Test</h3>
        <button onclick="testAuth()">Test Login & Token</button>
        <div id="authResult"></div>
    </div>
    
    <div class="test-section">
        <h3>Session Creation Test</h3>
        <button onclick="testSessionCreation()">Create Template Session</button>
        <div id="sessionResult"></div>
    </div>
    
    <div class="test-section">
        <h3>Question Creation Test</h3>
        <input type="text" id="sessionIdInput" placeholder="Session ID" />
        <button onclick="testQuestionCreation()">Start Question 1</button>
        <button onclick="testQuestionCreation()">Start Question 1 Again (Should Fail)</button>
        <div id="questionResult"></div>
    </div>
    
    <div class="test-section">
        <h3>Question Update Test</h3>
        <input type="text" id="questionIdInput" placeholder="Question ID" />
        <input type="text" id="fieldInput" placeholder="Field (e.g., question_text)" value="question_text" />
        <input type="text" id="valueInput" placeholder="Value" value="Test question text" />
        <button onclick="testQuestionUpdate()">Update Question</button>
        <div id="updateResult"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';
        let currentToken = null;
        let currentSessionId = null;
        
        async function testAuth() {
            const resultDiv = document.getElementById('authResult');
            resultDiv.innerHTML = 'Testing authentication...';
            
            try {
                // Test login
                const loginResponse = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'test_host_user' })
                });
                
                if (!loginResponse.ok) {
                    throw new Error(`Login failed: ${loginResponse.status}`);
                }
                
                const loginData = await loginResponse.json();
                currentToken = loginData.token;
                
                // Store like the real app
                localStorage.setItem('token', currentToken);
                localStorage.setItem('user', JSON.stringify({
                    username: loginData.username,
                    sessionToken: currentToken
                }));
                
                resultDiv.innerHTML = `
                    <div class="success">✓ Login successful</div>
                    <div class="info">Username: ${loginData.username}</div>
                    <div class="info">Token: ${currentToken.substring(0, 30)}...</div>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">✗ Auth failed: ${error.message}</div>`;
            }
        }
        
        async function testSessionCreation() {
            const resultDiv = document.getElementById('sessionResult');
            
            if (!currentToken) {
                resultDiv.innerHTML = '<div class="error">Please login first</div>';
                return;
            }
            
            resultDiv.innerHTML = 'Creating template session...';
            
            try {
                const response = await fetch(`${API_URL}/api/sessions/create`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: 'Test Template Session',
                        subject: 'testing',
                        description: 'Testing template creation',
                        template_mode: true,
                        settings: {
                            max_participants: 5,
                            max_questions: 10,
                            allow_llm: true,
                            allow_user_questions: true,
                            question_numbering: true
                        }
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Session creation failed: ${response.status}`);
                }
                
                const data = await response.json();
                currentSessionId = data.session.session_id;
                
                resultDiv.innerHTML = `
                    <div class="success">✓ Session created</div>
                    <div class="info">Session ID: ${currentSessionId}</div>
                    <div class="info">Session Code: ${data.session.session_code}</div>
                    <div class="info">Host: ${data.session.host_username}</div>
                `;
                
                document.getElementById('sessionIdInput').value = currentSessionId;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">✗ Session creation failed: ${error.message}</div>`;
            }
        }
        
        async function testQuestionCreation() {
            const resultDiv = document.getElementById('questionResult');
            const sessionId = document.getElementById('sessionIdInput').value || currentSessionId;
            
            if (!currentToken || !sessionId) {
                resultDiv.innerHTML = '<div class="error">Please login and create session first</div>';
                return;
            }
            
            resultDiv.innerHTML = 'Starting question 1...';
            
            try {
                const response = await fetch(`${API_URL}/api/sessions/${sessionId}/questions/1/start`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ type: 'open_ended' })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    resultDiv.innerHTML = `<div class="error">✗ Question creation failed: ${data.error}</div>`;
                    return;
                }
                
                document.getElementById('questionIdInput').value = data.question.question_id;
                
                resultDiv.innerHTML = `
                    <div class="success">✓ Question 1 started</div>
                    <div class="info">Question ID: ${data.question.question_id}</div>
                    <div class="info">Type: ${data.question.type}</div>
                    <div class="info">Status: ${data.question.status}</div>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">✗ Question creation failed: ${error.message}</div>`;
            }
        }
        
        async function testQuestionUpdate() {
            const resultDiv = document.getElementById('updateResult');
            const sessionId = document.getElementById('sessionIdInput').value || currentSessionId;
            const questionId = document.getElementById('questionIdInput').value;
            const field = document.getElementById('fieldInput').value;
            const value = document.getElementById('valueInput').value;
            
            if (!currentToken || !sessionId || !questionId) {
                resultDiv.innerHTML = '<div class="error">Please complete previous tests first</div>';
                return;
            }
            
            resultDiv.innerHTML = 'Updating question...';
            
            try {
                const response = await fetch(`${API_URL}/api/sessions/${sessionId}/questions/${questionId}/update`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ field, value })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    resultDiv.innerHTML = `<div class="error">✗ Question update failed: ${data.error}</div>`;
                    return;
                }
                
                resultDiv.innerHTML = `
                    <div class="success">✓ Question updated</div>
                    <div class="info">Field: ${data.field}</div>
                    <div class="info">Value: ${data.value}</div>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">✗ Question update failed: ${error.message}</div>`;
            }
        }
        
        // Auto-load saved token if available
        window.onload = function() {
            const savedToken = localStorage.getItem('token');
            if (savedToken) {
                currentToken = savedToken;
                document.getElementById('authResult').innerHTML = 
                    `<div class="info">Found saved token: ${savedToken.substring(0, 30)}...</div>`;
            }
        };
    </script>
</body>
</html>
