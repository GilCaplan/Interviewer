<!DOCTYPE html>
<html>
<head>
    <title>Debug Questions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { margin: 5px; padding: 8px 15px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Debug Questions Tool</h1>
    
    <div class="section">
        <h3>Session Info</h3>
        <input type="text" id="sessionId" placeholder="Session ID" style="width: 300px;" />
        <button onclick="getSessionInfo()">Get Session Info</button>
        <div id="sessionResult"></div>
    </div>
    
    <div class="section">
        <h3>Clear Session Questions</h3>
        <p>This will clear all questions from the session for debugging purposes.</p>
        <button onclick="clearQuestions()" style="background: red; color: white;">Clear All Questions</button>
        <div id="clearResult"></div>
    </div>
    
    <div class="section">
        <h3>Debug Console</h3>
        <button onclick="showAuthInfo()">Show Auth Info</button>
        <button onclick="testAPI()">Test API Connection</button>
        <div id="debugResult"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';
        
        function getToken() {
            let token = localStorage.getItem('token');
            if (!token) {
                const storedUser = localStorage.getItem('user');
                if (storedUser) {
                    try {
                        const userData = JSON.parse(storedUser);
                        token = userData.sessionToken;
                    } catch (e) {
                        console.error('Failed to parse user data:', e);
                    }
                }
            }
            return token;
        }
        
        async function getSessionInfo() {
            const sessionId = document.getElementById('sessionId').value;
            const resultDiv = document.getElementById('sessionResult');
            
            if (!sessionId) {
                resultDiv.innerHTML = '<div class="error">Please enter a session ID</div>';
                return;
            }
            
            const token = getToken();
            if (!token) {
                resultDiv.innerHTML = '<div class="error">No authentication token found</div>';
                return;
            }
            
            try {
                resultDiv.innerHTML = 'Loading session info...';
                
                const response = await fetch(`${API_URL}/api/sessions/${sessionId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="success">✓ Session Info Retrieved</div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">✗ Error: ${error.message}</div>`;
            }
        }
        
        async function clearQuestions() {
            const sessionId = document.getElementById('sessionId').value;
            const resultDiv = document.getElementById('clearResult');
            
            if (!sessionId) {
                resultDiv.innerHTML = '<div class="error">Please enter a session ID first</div>';
                return;
            }
            
            if (!confirm('Are you sure you want to clear all questions? This cannot be undone!')) {
                return;
            }
            
            const token = getToken();
            if (!token) {
                resultDiv.innerHTML = '<div class="error">No authentication token found</div>';
                return;
            }
            
            try {
                resultDiv.innerHTML = 'Clearing questions...';
                
                // First get the session to see what questions exist
                const sessionResponse = await fetch(`${API_URL}/api/sessions/${sessionId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!sessionResponse.ok) {
                    throw new Error('Could not fetch session data');
                }
                
                const sessionData = await sessionResponse.json();
                const session = sessionData.session;
                
                // Clear questions_queue and ready_questions by updating the session
                const clearResponse = await fetch(`${API_URL}/api/sessions/${sessionId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        template_data: {
                            current_question_number: 0,
                            questions_queue: [],
                            ready_questions: []
                        }
                    })
                });
                
                if (clearResponse.ok) {
                    resultDiv.innerHTML = '<div class="success">✓ Questions cleared successfully</div>';
                } else {
                    resultDiv.innerHTML = `<div class="error">✗ Failed to clear questions: ${clearResponse.status}</div>`;
                }
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">✗ Error: ${error.message}</div>`;
            }
        }
        
        function showAuthInfo() {
            const resultDiv = document.getElementById('debugResult');
            const token = getToken();
            const user = localStorage.getItem('user');
            
            resultDiv.innerHTML = `
                <div class="info">Authentication Debug Info:</div>
                <pre>Token: ${token ? token.substring(0, 50) + '...' : 'None'}
User Data: ${user || 'None'}
API URL: ${API_URL}</pre>
            `;
        }
        
        async function testAPI() {
            const resultDiv = document.getElementById('debugResult');
            
            try {
                resultDiv.innerHTML = 'Testing API connection...';
                
                const response = await fetch(`${API_URL}/api/health`);
                const data = await response.text();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="success">✓ API is responding</div><pre>${data}</pre>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">✗ API error: ${response.status}</div>`;
                }
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">✗ Connection failed: ${error.message}</div>`;
            }
        }
        
        // Auto-populate session ID from URL if available
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session');
            if (sessionId) {
                document.getElementById('sessionId').value = sessionId;
            }
            
            showAuthInfo();
        };
    </script>
</body>
</html>
