<!DOCTYPE html>
<html>
<head>
    <title>Debug Authentication</title>
</head>
<body>
    <h2>Authentication Debug</h2>
    <div id="output"></div>
    
    <script>
        function debugAuth() {
            const output = document.getElementById('output');
            
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            let html = '<h3>LocalStorage Contents:</h3>';
            html += `<p><strong>Direct token:</strong> ${token ? 'Found (' + token.substring(0, 20) + '...)' : 'Not found'}</p>`;
            html += `<p><strong>User object:</strong> ${user ? 'Found' : 'Not found'}</p>`;
            
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    html += `<p><strong>User data:</strong></p>`;
                    html += `<pre>${JSON.stringify(userData, null, 2)}</pre>`;
                } catch (e) {
                    html += `<p><strong>Error parsing user:</strong> ${e.message}</p>`;
                }
            }
            
            html += '<h3>Test Login:</h3>';
            html += '<button onclick="testLogin()">Test Login</button>';
            html += '<div id="loginResult"></div>';
            
            output.innerHTML = html;
        }
        
        async function testLogin() {
            const resultDiv = document.getElementById('loginResult');
            resultDiv.innerHTML = 'Testing login...';
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username: 'debug_user' })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    
                    // Store token like the real app does
                    localStorage.setItem('user', JSON.stringify({
                        username: data.username,
                        sessionToken: data.token
                    }));
                    localStorage.setItem('token', data.token);
                    
                    resultDiv.innerHTML = `<p style="color: green;">Login successful! Token: ${data.token.substring(0, 20)}...</p>`;
                    debugAuth(); // Refresh the display
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">Login failed: ${response.status}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        // Run on load
        debugAuth();
    </script>
</body>
</html>
